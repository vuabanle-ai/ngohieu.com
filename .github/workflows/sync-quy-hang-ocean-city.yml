name: Cập nhật quỹ hàng Ocean City
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency:
  group: sync-quy-hang-ocean-city
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl==3.1.5
      - name: Đọc bảng hàng Joy Homes và cập nhật sa bàn
        run: python3 tools/auto_sync_ocean_city.py
      - name: Đẩy lên web nếu quỹ hàng thay đổi
        run: |
          F=du-an/Ocean-City/quy-hang.json
          git config user.name "ngohieu-bot"
          git config user.email "ngohieu-bot@users.noreply.github.com"
          if git diff --quiet -- $F; then echo "Không đổi"; exit 0; fi
          python3 - <<'PY'
          import json,subprocess
          F='du-an/Ocean-City/quy-hang.json'
          old=json.loads(subprocess.check_output(['git','show','HEAD:'+F]))
          new=json.load(open(F))
          if {k:old.get(k) for k in ('available','sold','check')}=={k:new.get(k) for k in ('available','sold','check')}:
              subprocess.run(['git','checkout','--',F])
          PY
          git diff --quiet -- $F && { echo "Chỉ đổi giờ, bỏ qua"; exit 0; }
          git add $F
          git commit -m "Quỹ hàng Ocean City: tự cập nhật từ bảng hàng Joy Homes $(TZ=Asia/Ho_Chi_Minh date '+%H:%M %d/%m/%Y')"
          git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || true
          git push
